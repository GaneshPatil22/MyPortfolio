<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/profile.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ganesh Patil — Sr. iOS Developer & Full-Stack Engineer</title>
    <meta name="description" content="Portfolio of Ganesh Patil — Sr. iOS Developer with 8.5+ years of experience building high-quality apps in Swift, SwiftUI, React, and Node.js. Founder of CoreLearnly." />
    <meta name="keywords" content="Ganesh Patil, iOS Developer, Swift, SwiftUI, React, Full-Stack Developer, Portfolio, CoreLearnly, Mobile Developer" />
    <meta name="author" content="Ganesh Patil" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ganesh Patil — Sr. iOS Developer & Full-Stack Engineer" />
    <meta property="og:description" content="8.5+ years building impactful iOS apps and full-stack web experiences. Check out my projects, experience, and blog." />
    <meta property="og:image" content="/assets/profile.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ganesh Patil — Sr. iOS Developer & Full-Stack Engineer" />
    <meta name="twitter:description" content="8.5+ years building impactful iOS apps and full-stack web experiences. Check out my projects, experience, and blog." />
    <meta name="twitter:image" content="/assets/profile.jpg" />
    <!-- Critical CSS to prevent flash -->
    <style>
      html { background-color: #0f172a; }
      html.light { background-color: #f8fafc; }
    </style>
    <script>
      // Set theme immediately - dark is default
      (function() {
        var stored = localStorage.getItem('portfolio-theme');
        if (stored === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
